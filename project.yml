# XcodeGen spec — the reproducible way to (re)generate MorningBrief.xcodeproj.
#
#   brew install xcodegen && xcodegen generate
#
# A checked-in .xcodeproj is also provided, so this is only needed if you'd
# rather generate than trust the committed one.
name: MorningBrief

options:
  bundleIdPrefix: com.morningbrief
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MorningBrief:
    type: application
    platform: iOS
    sources:
      - path: MorningBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anotherwolf.closure
        PRODUCT_NAME: MorningBrief
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Morning Brief
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
