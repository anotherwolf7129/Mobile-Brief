# XcodeGen spec — the single source of truth for MorningBrief.xcodeproj.
#
#   brew install xcodegen && xcodegen generate
#
# The .xcodeproj is generated, not committed: CI regenerates it on every build,
# so a checked-in copy can only ever drift out of sync with this file.
name: MorningBrief

options:
  bundleIdPrefix: com.anotherwolf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MorningBrief:
    type: application
    platform: iOS
    sources:
      - path: MorningBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anotherwolf.closure
        PRODUCT_NAME: MorningBrief
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Morning Brief
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

# Declared explicitly rather than left to Xcode: Xcode only auto-creates a
# scheme when a human opens the project, and it isn't shared. CI never opens
# it, so `build-ipa --scheme MorningBrief` needs the scheme to exist on disk.
schemes:
  MorningBrief:
    build:
      targets:
        MorningBrief: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
